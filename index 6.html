{n:"Schokoladen-Brownie",ic:"🍪",q:"Erfolg „Brownie Lover“",ok:s=>s.ach.x1,c:{t1:"#5a2f1d",t2:"#33180d",t3:"#1d0c05",s1:"#3d1c0e",s2:"#25100a",s3:"#140705",w1:"#f1d9b0",w2:"#b88b52",cr:"#8a5a3a",g:"#8a4b2aaa"}},
{n:"Gold-Brownie",ic:"🥇",q:"Erfolg „Millionaire“",ok:s=>s.ach.x3,c:{t1:"#ffe27a",t2:"#d9a21b",t3:"#8a5a00",s1:"#c98d12",s2:"#8a5a00",s3:"#5a3a00",w1:"#fff3c4",w2:"#e0a82e",cr:"#fff1a8",g:"#ffcf6bcc"}},
{n:"Lava-Brownie",ic:"🌋",q:"Prestige 1",ok:s=>s.lv>=1,c:{t1:"#ff6a2b",t2:"#a8200a",t3:"#3a0a04",s1:"#6a1604",s2:"#3a0a04",s3:"#1c0502",w1:"#ffd27a",w2:"#ff7a1a",cr:"#ffb04a",g:"#ff4a1acc"}},

// Zahlen
function fm(n){if(!isFinite(n))return"∞";if(n<0)n=0;if(fmtMode===2&&n>=1e6)return n.toExponential(2).replace(".",",");
 if(n<1e3)return n<10?n.toFixed(1).replace(".",",").replace(/,0$/,""):String(Math.floor(n));
 const e=Math.min(Math.floor(Math.log10(n)/3)-1,NA.length-1),v=n/Math.pow(1e3,e+1);if(v<1e3&&e===0&&fmtMode===0&&n<1e4)return Math.floor(n).toLocaleString("de-DE");
 const s=v.toFixed(2);return(fmtMode===1?s:s.replace(".",","))+" "+(fmtMode===1?NE[e]:NA[e])}
const hm=t=>Math.floor(t/3600)+" h "+Math.floor(t%3600/60)+" min";

function unpack(j){const o=JSON.parse(j);if(!o||typeof o.b!=="number")throw 0;if(o.lv==null)o.lv=o.asc||0;const s=Object.assign(fresh(),o,{own:B.map((_,i)=>+(o.own&&o.own[i])||0)});
 s.maxLv=Math.max(s.maxLv||0,s.lv);s.all=Math.max(s.all,s.tot);if(!isFinite(s.b)||s.b<0)s.b=0;return s}

function calc(){const P=PM(S.lv);let g=1,cm=1;const tm=B.map(()=>1);for(const u of U){if(!S.up[u.id])continue;if(u.glob)g*=1.05;else if(u.click)cm*=2;else if(u.b!=null)tm[u.b]*=2}
 let raw=0;B.forEach((b,i)=>raw+=S.own[i]*b[3]*tm[i]);raw*=g;let f=1,k=1;for(const x of buffs){if(x.k==="f")f=7;if(x.k==="k")k=777}
 C={raw,P,tm,g,bps:raw*P*f,bpc:(cm+(S.up.c_pct?.01*raw:0))*P*k}}
const earn=x=>{if(!(x>0))return;S.b+=x;S.tot+=x;S.all+=x;dirty=true};

// Benachrichtigungen & Effekte
function toast(t,m){const d=document.createElement("div");d.className="toast";d.innerHTML="<b>"+t+"</b><br>"+m;const c=$("toasts");while(c.children.length>3)c.firstChild.remove();c.appendChild(d);setTimeout(()=>d.remove(),3900)}
function burst(n,cols,x,y,sp){if(!S.part)return;for(let i=0;i<n;i++){const p=document.createElement("div");p.className="pt";p.style.left=x+"px";p.style.top=y+"px";p.style.background=cols[i%cols.length];const a=Math.random()*6.28,r=(.3+Math.random())*sp;p.style.setProperty("--x",Math.cos(a)*r+"px");p.style.setProperty("--y",Math.sin(a)*r+"px");document.body.appendChild(p);setTimeout(()=>p.remove(),950)}}
function bigGain(x){if(x>S.b*.1||x>C.bps*30){const e=$("bank");e.classList.remove("big");void e.offsetWidth;e.classList.add("big")}}

const br=$("brownie");br.addEventListener("dragstart",e=>e.preventDefault());br.addEventListener("contextmenu",e=>e.preventDefault());

 if(S.anim){br.classList.remove("hit");void br.offsetWidth;br.classList.add("hit")}
 const p=document.createElement("div");p.className="pop";p.textContent="+"+fm(g);p.style.left=(e.clientX-16)+"px";p.style.top=(e.clientY-24)+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),1000);
 burst(7,[SK[S.skin].c.t1,SK[S.skin].c.t2,SK[S.skin].c.w1],e.clientX,e.clientY,70)});

// Goldener Brownie
let gt=45+Math.random()*75;
function spawnGold(){const g=$("gold");g.style.display="block";g.style.left=(10+Math.random()*(innerWidth-120))+"px";g.style.top=(90+Math.random()*(innerHeight-250))+"px";g.dataset.till=Date.now()+13e3}
$("gold").onclick=()=>{const g=$("gold"),r=g.getBoundingClientRect();burst(24,["#ffcf6b","#fff","#ff7eb6"],r.left+30,r.top+30,120);g.style.display="none";S.gc++;dirty=true;const q=Math.random();

 else if(q<.9){buffs.push({k:"k",n:"👆 Klick-Raserei ×777",e:Date.now()+13e3});toast("Goldener Brownie","Klick-Raserei! Klicks ×777 für 13 s")}
 else{const a=C.bps*60+100;bigGain(a);earn(a);toast("Goldener Brownie","Brownie-Regen! +"+fm(a)+" Brownies")}calc()};
// Prestige
function doPrestige(){const c=PC(S.lv);if(S.tot<c)return;if(!confirm("Prestige-Aufstieg auf Level "+(S.lv+1)+"?\nBrownies, Generatoren und Boosts werden zurückgesetzt. Dein gesamtes Einkommen wird ×"+fm(PM(S.lv+1))+".\nErfolge, Skins, Lebenszeit-Statistiken und Titel bleiben."))return;
 const o=S,n=fresh();n.all=o.all;n.clicks=o.clicks;n.ach=o.ach;n.lv=o.lv+1;n.maxLv=Math.max(o.maxLv,n.lv);n.gc=o.gc;n.pt=o.pt;n.t0=o.t0;n.name=o.name;n.fmt=o.fmt;n.anim=o.anim;n.part=o.part;n.skin=o.skin;n.dl=o.dl;n.ds=o.ds;n.god=o.god;n.title=o.title;S=n;buffs=[];calc();

 const ov=$("ov");ov.innerHTML="<div><span>"+(god?"👑 PRESTIGE GOTT":"✨ PRESTIGE "+S.lv)+"</span><small>Einkommen ×"+fm(PM(S.lv))+"</small></div>";ov.classList.remove("on");void ov.offsetWidth;ov.classList.add("on");
 burst(god?110:50,god?["#ffcf6b","#b57cff","#ff7eb6","#fff"]:["#ffcf6b","#ff7eb6"],innerWidth/2,innerHeight/2,god?520:300);
 if(tt[0]!==old[0])setTimeout(()=>toast("Neuer Titel!",tt[1]+" "+tt[0]),900);if(god)setTimeout(()=>toast("👑 PRESTIGE GOTT","Du hast Prestige-Level 20 erreicht!"),1500);

function dInfo(){const t=ymd(new Date()),y=new Date();y.setDate(y.getDate()-1);const can=S.dl!==t;let st=S.ds;if(can&&S.dl!==ymd(y))st=0;return{t,can,st,day:can?st+1:S.ds+1}}
const rew=d=>Math.ceil(Math.max(1000*d*(1+d/3),C.bps*600*(1+d*.25)));
function claim(){const d=dInfo();if(!d.can)return;const r=rew(d.day);bigGain(r);earn(r);S.ds=d.day;S.dl=d.t;dirty=true;toast("📅 Tägliche Belohnung","Tag "+d.day+": +"+fm(r)+" Brownies");burst(30,["#ffcf6b","#fff"],innerWidth/2,innerHeight/2,260);build()}

const BF={
pf(){const T2=titles(),q=eqT(),n=T2.filter(t=>t.ok).length;return'<div class="card r3"><div class="i">👤</div><div class="n"><b>'+esc(S.name||"Bäcker")+'</b><small>'+(q?q.ic+" "+q.n:"Kein Titel ausgerüstet")+'</small><small>Prestige '+S.lv+' (max. '+S.maxLv+') · '+fm(S.all)+' Brownies · '+hm(S.pt)+'</small></div></div><button class="buy" data-a="pfn">✏️ Name ändern</button> <button class="buy" data-a="pfu" style="background:#fff2;color:#fff">Titel ablegen</button><div class="lbl" style="margin:12px 0 4px">Titel ('+n+'/'+T2.length+') – nur Deko, keine Boni</div>'+T2.slice().sort((a,b)=>b.ok-a.ok).map(t=>'<div class="card'+(S.title===t.id?" r3":"")+(t.ok?"":" lock")+'"><div class="i">'+(t.ok?t.ic:"🔒")+'</div><div class="n"><b>'+t.n+'</b><small>'+(t.ok?"Freigeschaltet":t.q)+'</small></div>'+(t.ok?'<button class="buy" data-a="tt" data-v="'+t.id+'">'+(S.title===t.id?"Aktiv":"Ausrüsten")+'</button>':'')+'</div>').join("")},

daily(){const d=dInfo();let h='<div class="card"><div class="i">📅</div><div class="n"><b>Tagesserie: '+(d.can?d.st:S.ds)+' Tage</b><small>'+(d.can?"Deine Belohnung wartet!":"Heute schon abgeholt – komm morgen wieder.")+'</small></div></div>';
 for(let k=0;k<7;k++){const n=d.day+k;h+='<div class="card '+(k===0?"r3":"")+'"><div class="i">'+(k===0&&d.can?"🎁":"📦")+'</div><div class="n"><b>Tag '+n+'</b><small>+'+fm(rew(n))+' Brownies</small></div>'+(k===0?'<button class="buy" data-a="daily"'+(d.can?"":" disabled")+'>'+(d.can?"Abholen":"Morgen")+'</button>':"")+'</div>'}return h},
skin(){return SK.map((k,i)=>{const ok=k.ok(S);return'<div class="card '+(S.skin===i?"r3":"")+'"><div class="i sk" style="background:linear-gradient(135deg,'+k.c.t1+','+k.c.t2+','+k.c.t3+')">'+k.ic+'</div><div class="n"><b>'+k.n+'</b><small>'+(ok?"Freigeschaltet":"🔒 "+k.q)+'</small></div><button class="buy" data-a="skin" data-v="'+i+'"'+(ok?"":" disabled")+'>'+(S.skin===i?"Aktiv":"Wählen")+'</button></div>'}).join("")},
set(){const sw=(k,l)=>'<div class="row"><span>'+l+'</span><button class="buy" data-a="'+k+'">'+(S[k]?"An":"Aus")+'</button></div>';return sw("anim","Animationen")+sw("part","Partikeleffekte")+'<div class="row"><span>Zahlenformat</span><select id="fsel"><option value="0">Deutsch (K, Mio., Mrd.)</option><option value="1">Englisch (K, M, B)</option><option value="2">Wissenschaftlich</option></select></div><h2 style="font-size:14px;color:var(--go);margin:14px 0 6px">Spielstand</h2><button class="buy" data-a="save">💾 Speichern</button> <button class="buy" data-a="exp" style="background:#fff2;color:#fff">⬆ Export</button> <button class="buy" data-a="imp" style="background:#fff2;color:#fff">⬇ Import</button><div id="sv" style="font-size:11px;color:var(--m);margin:6px 0"></div><textarea id="ta" style="display:none" placeholder="Export-Code einfügen und erneut Import tippen"></textarea><button class="buy" data-a="reset" style="margin-top:12px;background:#a1123a;color:#fff">Spielstand zurücksetzen</button>'},
lb(){return'<div class="tabs">'+[["lv","Prestige"],["pt","Spielzeit"],["ups","Upgrades"]].map(k=>'<button data-a="lbk" data-v="'+k[0]+'" class="'+(lbk===k[0]?"on":"")+'">'+k[1]+'</button>').join("")+'</div><div id="lbl"></div><button class="buy" data-a="lbn" style="margin-top:10px">✏️ Name ändern</button>'}};
function build(){if(!cur)return;const sc=$("mc").scrollTop;$("mc").innerHTML=BF[cur]();$("mc").scrollTop=sc;sig=SG[cur]();if(cur==="set")$("fsel").value=S.fmt;if(cur==="lb")lbShow();dyn()}
function dyn(){if(cur==="up"){if(tab==="g")B.forEach((b,i)=>{const c=cost(i,S.own[i]);$("go"+i).textContent="+"+fm(b[3]*C.tm[i]*C.g*C.P)+" Brownies/s je Stück";$("gc"+i).textContent="Preis: "+fm(c);$("gn"+i).textContent=S.own[i];$("gb"+i).disabled=S.b<c;$("gb"+i).textContent=fm(c)});else document.querySelectorAll("[data-c]").forEach(e=>e.disabled=S.b<+e.dataset.c)}
 if(cur==="pre"){const c=PC(S.lv);$("pl").textContent=S.lv;$("pm").textContent=fm(C.P)+"×";$("pn").textContent=fm(PM(S.lv+1))+"×";$("pc").textContent=fm(S.tot)+" / "+fm(c);$("pb").style.width=Math.min(100,S.tot/c*100)+"%";$("pp").textContent=Math.min(100,S.tot/c*100).toFixed(1).replace(".",",")+" %";$("pbt").disabled=S.tot<c}}
$("mc").addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.disabled)return;const a=t.dataset.a,v=t.dataset.v;
 if(a==="tab"){tab=v;build()}else if(a==="bg")buy(+v);else if(a==="bu")buyUp(v);else if(a==="pres")doPrestige();else if(a==="daily")claim();
 else if(a==="skin"){S.skin=+v;applySkin();dirty=true;build()}else if(a==="anim"||a==="part"){S[a]=S[a]?0:1;document.body.classList.toggle("noanim",!S.anim);dirty=true;build()}
 else if(a==="save")save(1);else if(a==="exp")doExport();else if(a==="imp")doImport();else if(a==="reset"){if(confirm("Wirklich ALLES löschen? Das kann nicht rückgängig gemacht werden.")){S=fresh();buffs=[];fmtMode=0;document.body.classList.remove("noanim","god");calc();applySkin();save(1);build()}}
 else if(a==="tt"){S.title=v;dirty=true;build()}else if(a==="pfu"){S.title="";dirty=true;build()}else if(a==="pfn"){const n=(prompt("Neuer Name:",S.name||"")||"").slice(0,16).trim();if(n){S.name=n;dirty=true;build()}}
 else if(a==="lbk"){lbk=v;build()}else if(a==="lbn"){const n=(prompt("Neuer Name:",S.name||"")||"").slice(0,16).trim();if(n){S.name=n;dirty=true;lbShow()}}});
$("mc").addEventListener("change",e=>{if(e.target.id==="fsel"){S.fmt=fmtMode=+e.target.value;dirty=true}});
// Speichern
function pack(){S.t=Date.now();return JSON.stringify(S)}
async function save(m){const j=pack();try{localStorage.setItem(KEY,j)}catch(e){}let w="lokal";if(cloud){try{await cloud.set({json:j,t:S.t});w="Cloud + lokal"}catch(e){}}post();dirty=false;const s=$("sv");if(s)s.textContent="Gespeichert ("+w+") "+new Date().toLocaleTimeString("de-DE");if(m)toast("💾 Gespeichert",w)}
async function doExport(){const j=btoa(unescape(encodeURIComponent(pack())));const ta=$("ta");ta.style.display="block";ta.value=j;ta.select();try{await navigator.clipboard.writeText(j);toast("Export","Code kopiert")}catch(e){toast("Export","Code markieren und kopieren")}try{const d=await claude.use("downloads");if(d)await d.save({filename:"brownie-clicker-x-save.txt",data:j})}catch(e){}}
function doImport(){const ta=$("ta");if(ta.style.display==="none"||!ta.value.trim()){ta.style.display="block";ta.value="";ta.focus();toast("Import","Code einfügen, dann nochmal Import");return}try{S=unpack(decodeURIComponent(escape(atob(ta.value.trim()))));fmtMode=S.fmt;buffs=[];calc();applySkin();document.body.classList.toggle("god",!!S.god);document.body.classList.toggle("noanim",!S.anim);save(1);build()}catch(e){toast("Import","Ungültiger Code")}}
// Rangliste
function post(){if(!DB||!UID)return;if(!S.name)S.name="Bäcker"+UID.slice(0,4);DB.doc("board/"+UID).set({name:S.name,lv:S.lv,pt:Math.floor(S.pt),ups:Object.keys(S.up).length,t:Date.now()}).catch(()=>{})}
async function lbShow(){const L=$("lbl");if(!L)return;L.textContent="Lade …";const f2=v=>lbk==="pt"?hm(v):v;let rows=[];
 if(DB){try{post();const q=await DB.collection("board").orderBy(lbk,"desc").limit(20).get();rows=q.docs.map(d=>Object.assign({id:d.id},d.data()))}catch(e){L.textContent="Ranglisten konnten nicht geladen werden.";return}}
 else rows=[{id:"me",name:S.name||"Du",lv:S.lv,pt:S.pt,ups:Object.keys(S.up).length}];
 L.innerHTML=(DB?"":"<small>Online-Ranglisten gibt es nur in der claude.ai-Version. Hier siehst du nur dich.</small>")+rows.map((r,i)=>'<div class="row"><span>'+(i+1)+'. '+String(r.name||"?").replace(/[<>&]/g,"")+(r.id===UID||r.id==="me"?" (du)":"")+'</span><span>'+f2(r[lbk]||0)+'</span></div>').join("")||"Noch keine Einträge."}
// Titel (nur Deko)
const esc=x=>String(x).replace(/[<>&"]/g,"");
function titles(){const t=[];[["Brownie Anfänger","🍫",0],["Brownie Experte","🎖️",5],["Prestige Meister","🏅",10],["Prestige Legende","🏆",15]].forEach(a=>t.push({id:"l"+a[2],ic:a[1],n:a[0],ok:S.maxLv>=a[2],q:"Erreiche Prestige "+a[2]}));AC.forEach(a=>t.push({id:a.id,ic:a.ic,n:a.n,ok:!!S.ach[a.id],q:"Erfolg: "+a.n}));t.push({id:"god",ic:"👑",n:"PRESTIGE GOTT",ok:S.maxLv>=20,q:"Erreiche Prestige 20",god:1});return t}
const eqT=()=>titles().find(t=>t.id===S.title&&t.ok);
// Shop-Leiste
const shop=$("shop");B.forEach((b,i)=>{const r=document.createElement("button");r.className="srow";r.innerHTML='<span class="si">'+b[0]+'</span><span class="sn"><b>'+b[1]+'</b><small></small><div class="sc"></div></span><span class="so"></span>';r.onclick=()=>buy(i);shop.appendChild(r)});
let ssig="",selU=null;const tipEl=$("tip");
function showTip(el,u){tipEl.innerHTML="<b>"+u.nm+"</b><br>"+u.ds+"<br><span style='color:#ffcf6b'>"+fm(u.cost)+" Brownies</span>";tipEl.style.display="block";const r=el.getBoundingClientRect();tipEl.style.left=Math.min(innerWidth-260,Math.max(4,r.left-100))+"px";tipEl.style.top=Math.max(4,r.top-84)+"px"}
function storeUpd(){[...shop.children].forEach((r,i)=>{const c=cost(i,S.own[i]);r.querySelector("small").textContent="+"+fm(B[i][3]*C.tm[i]*C.g*C.P)+"/s je Stück";r.querySelector(".sc").textContent=fm(c)+" 🍫";r.querySelector(".so").textContent=S.own[i];r.classList.toggle("no",S.b<c)});
 const a=avail().slice(0,60),sg=a.map(u=>u.id).join();if(sg!==ssig){ssig=sg;const c=$("ups");c.innerHTML="";tipEl.style.display="none";a.forEach(u=>{const e=document.createElement("button");e.className="up";e.textContent=u.ic;e.dataset.c=u.cost;e.setAttribute("aria-label",u.nm);const touch=matchMedia("(hover:none)").matches;
  e.onmouseenter=()=>{if(!touch)showTip(e,u)};e.onmouseleave=()=>tipEl.style.display="none";
  e.onclick=()=>{if(touch&&selU!==u.id){selU=u.id;showTip(e,u);return}selU=null;tipEl.style.display="none";buyUp(u.id)};c.appendChild(e)});if(!a.length)c.innerHTML='<small style="color:var(--m)">Keine Upgrades verfügbar – kaufe mehr Gebäude!</small>'}
 document.querySelectorAll("#ups .up").forEach(e=>e.classList.toggle("no",S.b<+e.dataset.c))}
document.querySelectorAll(".mtabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mtabs button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("#app>.col").forEach(c=>c.classList.toggle("on",c.dataset.p===b.dataset.g))});
// Schleife
let last=Date.now(),sec=0,disp=0;
function slow(){AC.forEach(a=>{if(!S.ach[a.id]&&a.v(S)>=a.t){S.ach[a.id]=1;dirty=true;toast("🏆 Erfolg freigeschaltet",a.ic+" "+a.n);burst(18,["#ffcf6b","#b57cff","#ff7eb6"],innerWidth/2,90,200)}});
 if(S.lv>=20&&!S.god){S.god=1;document.body.classList.add("god")}}
function tick(){const n=Date.now(),dt=Math.min((n-last)/1e3,5);last=n;if(!document.hidden)S.pt+=dt;buffs=buffs.filter(x=>x.e>n);calc();earn(C.bps*dt);if(!(S.b>=0))S.b=0;
 gt-=dt;const g=$("gold");if(gt<=0&&g.style.display==="none"){spawnGold();gt=45+Math.random()*75}if(g.style.display==="block"&&n>+g.dataset.till)g.style.display="none";
 sec+=dt;if(sec>=1){sec=0;slow()}
 const q=eqT()||(S.lv>=20?titles().find(x=>x.god):null)||(()=>{const t=T(S.lv);return{ic:t[1],n:t[0]}})();$("title").textContent=q.ic+" "+q.n;$("title").className=q.god?"godt":"";storeUpd();$("bps").textContent=fm(C.bps);$("bpk").textContent=fm(C.bpc);$("tot").textContent=fm(S.all);$("plv").textContent=S.lv;$("mul").textContent=fm(C.P)+"×";
 $("buffs").innerHTML=buffs.map(x=>'<span class="buff">'+x.n+" "+Math.ceil((x.e-n)/1e3)+"s</span>").join("");$("bank").classList.toggle("up",C.bps>0);
 if(cur){const s=SG[cur]();if(s!==sig)build();else dyn()}}
function frame(){const d=S.b-disp;disp=(!S.anim||Math.abs(d)<.5||d<0)?S.b:disp+d*.2;$("bank").textContent=fm(disp);$("tb").textContent=fm(disp)+" 🍫";$("tbs").textContent="pro Sekunde: "+fm(C.bps)+" · pro Klick: "+fm(C.bpc);document.title=fm(S.b)+" – Brownie Clicker X";requestAnimationFrame(frame)}
setInterval(tick,100);setInterval(()=>{if(dirty)save()},10000);setInterval(()=>{if(DB)post()},60000);
addEventListener("pagehide",()=>{try{localStorage.setItem(KEY,pack())}catch(e){}});
document.addEventListener("visibilitychange",()=>{if(document.hidden){try{localStorage.setItem(KEY,pack())}catch(e){}if(cloud)save()}else last=Date.now()});
// Start
try{const j=localStorage.getItem(KEY)||localStorage.getItem(OLD);if(j)S=unpack(j)}catch(e){}
fmtMode=S.fmt;calc();
{const el=(Date.now()-S.t)/1e3;if(el>60){const g=C.bps*Math.min(el,7*86400)*.5;if(g>0){earn(g);setTimeout(()=>toast("🌙 Offline-Einnahmen","Du warst "+hm(el)+" weg und hast "+fm(g)+" Brownies gebacken."),600)}}}
document.body.classList.toggle("noanim",!S.anim);document.body.classList.toggle("god",!!S.god||S.lv>=20);applySkin();disp=S.b;frame();
(async()=>{try{const u=await claude.use("user"),db=await claude.use("db");if(!u||!db)return;const id=await u.id();if(!id)return;DB=db;UID=id;cloud=db.doc("data/users/"+id+"/save");
 const sn=await cloud.get();if(sn.exists){const d=sn.data();if(d&&d.json&&d.t>S.t){S=unpack(d.json);fmtMode=S.fmt;buffs=[];calc();applySkin();document.body.classList.toggle("god",!!S.god);document.body.classList.toggle("noanim",!S.anim);disp=S.b;toast("☁️ Cloud","Spielstand geladen")}}
 save()}catch(e){}})();
</script></body></html>
